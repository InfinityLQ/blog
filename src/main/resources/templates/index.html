<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 我的博客</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .blog-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px 0; margin-bottom: 30px; }
        .card-hover { transition: transform 0.2s; }
        .card-hover:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="blog-header">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h1 class="display-5">📝 我的博客</h1>
                    <p class="lead">分享技术，记录生活</p>
                </div>
                <a href="/admin" class="btn btn-light btn-sm">🔐 管理后台</a>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-md-8 mx-auto">
                <div th:if="${articles.isEmpty()}" class="text-center py-5">
                    <h3>📭 还没有文章，去后台发布第一篇吧！</h3>
                    <a href="/admin/publish" class="btn btn-primary mt-3">写文章</a>
                </div>
                
                <div th:each="article : ${articles}" class="card card-hover mb-4">
                    <div class="card-body">
                        <h4 class="card-title">
                            <a th:href="@{/article/{id}(id=${article.id})}" 
                               th:text="${article.title}" 
                               class="text-decoration-none text-dark">
                            </a>
                        </h4>
                        <div class="mb-2">
                            <span class="badge bg-primary" th:text="${article.category}">未分类</span>
                            <!-- 不再显示标签，彻底避免异常 -->
                            <span class="text-muted small float-end">
                                👁️ <span th:text="${article.views}">0</span>
                                &nbsp;|&nbsp;
                                📅 <span th:text="${#dates.format(article.createTime, 'yyyy-MM-dd')}">日期</span>
                            </span>
                        </div>
                        <p class="card-text text-muted" 
                           th:text="${#strings.abbreviate(article.content, 150)}">
                            内容预览...
                        </p>
                        <a th:href="@{/article/{id}(id=${article.id})}" class="btn btn-outline-primary btn-sm">阅读全文 →</a>
                    </div>
                </div>

                <nav th:if="${totalPages > 1}">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/(page=${currentPage - 1})}" th:if="${currentPage > 0}">上一页</a>
                            <span class="page-link" th:unless="${currentPage > 0}">上一页</span>
                        </li>
                        <li class="page-item active"><span class="page-link" th:text="${currentPage + 1}">1</span></li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled' : ''">
                            <a class="page-link" th:href="@{/(page=${currentPage + 1})}" th:if="${currentPage < totalPages - 1}">下一页</a>
                            <span class="page-link" th:unless="${currentPage < totalPages - 1}">下一页</span>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
        
        <footer class="text-center text-muted py-4">
            <small>© 2026 我的博客 · Powered by Spring Boot</small>
        </footer>
    </div>
</body>
</html>
