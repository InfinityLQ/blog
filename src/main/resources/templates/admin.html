<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 我的博客</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">🔐 管理后台</span>
            <div>
                <a href="/" class="btn btn-outline-light btn-sm">← 返回首页</a>
                <a href="/admin/publish" class="btn btn-success btn-sm">+ 写新文章</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3>📋 文章列表</h3>
            <span class="text-muted">共 <strong th:text="${articles.size()}">0</strong> 篇文章</span>
        </div>

        <div th:if="${articles.isEmpty()}" class="alert alert-info text-center">
            <h5>还没有文章</h5>
            <a href="/admin/publish" class="btn btn-primary mt-2">发布第一篇文章</a>
        </div>

        <div class="table-responsive" th:unless="${articles.isEmpty()}">
            <table class="table table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th style="width: 60px">ID</th>
                        <th>标题</th>
                        <th style="width: 120px">分类</th>
                        <th style="width: 80px">浏览</th>
                        <th style="width: 160px">发布时间</th>
                        <th style="width: 120px">操作</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="article : ${articles}">
                        <td th:text="${article.id}" class="text-muted">1</td>
                        <td>
                            <span th:text="${article.title}" class="fw-bold"></span>
                           
                        </td>
                        <td><span class="badge bg-primary" th:text="${article.category}">分类</span></td>
                        <td th:text="${article.views}">0</td>
                        <td th:text="${#dates.format(article.createTime, 'yyyy-MM-dd HH:mm')}" class="text-muted small">时间</td>
                        <td>
                            <a th:href="@{/article/{id}(id=${article.id})}" class="btn btn-sm btn-outline-primary me-1" title="查看">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/admin/delete/{id}(id=${article.id})}" 
                               class="btn btn-sm btn-outline-danger" 
                               title="删除"
                               onclick="return confirm('确定要删除这篇文章吗？')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
