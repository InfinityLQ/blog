<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布文章 - 我的博客</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container { max-width: 800px; margin: 0 auto; }
        .content-textarea { font-family: 'Courier New', monospace; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">✍️ 发布新文章</span>
            <a href="/admin" class="btn btn-outline-light btn-sm">← 返回管理</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="form-container">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form th:action="@{/admin/publish}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-bold">📌 标题 <span class="text-danger">*</span></label>
                            <input type="text" name="title" class="form-control form-control-lg" 
                                   placeholder="输入文章标题..." required autofocus>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">📝 内容 <span class="text-danger">*</span></label>
                            <textarea name="content" rows="12" class="form-control content-textarea" 
                                      placeholder="输入文章内容..." required></textarea>
                            <small class="text-muted">支持纯文本，换行自动保留</small>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">📂 分类</label>
                                <input type="text" name="category" class="form-control" 
                                       placeholder="如：Java、生活、技术">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">🏷️ 标签</label>
                                <input type="text" name="tags" class="form-control" 
                                       placeholder="多个标签用英文逗号分隔，如：Java,Spring,后端">
                            </div>
                        </div>
                        
                        <hr>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary btn-lg px-5">🚀 发布</button>
                            <a href="/admin" class="btn btn-secondary btn-lg px-4">取消</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
