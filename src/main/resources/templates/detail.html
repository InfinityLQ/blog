<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${article.title} + ' - 我的博客'">文章详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .article-content { font-size: 16px; line-height: 1.8; }
        .article-content p { margin-bottom: 1.2rem; }
        .back-btn { transition: all 0.2s; }
        .back-btn:hover { transform: translateX(-3px); }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-light">
        <div class="container">
            <a href="/" class="navbar-brand">📝 我的博客</a>
            <a href="/admin" class="btn btn-outline-secondary btn-sm">管理</a>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-lg-8 mx-auto">
                <a href="/" class="back-btn text-decoration-none text-secondary mb-3 d-inline-block">← 返回首页</a>
                
                <article class="card">
                    <div class="card-body">
                        <h1 class="card-title display-6" th:text="${article.title}">标题</h1>
                        
                        <div class="mb-3 text-muted small">
                            <span class="badge bg-primary" th:text="${article.category}">分类</span>
                            <!-- 移除标签显示，避免 null 异常 -->
                            <span class="ms-3">📅 <span th:text="${#dates.format(article.createTime, 'yyyy-MM-dd HH:mm')}">时间</span></span>
                            <span class="ms-3">👁️ <span th:text="${article.views}">0</span> 次浏览</span>
                        </div>
                        
                        <hr>
                        
                        <div class="article-content" th:utext="${#strings.replace(article.content, '\n', '<br>')}">
                            内容
                        </div>
                    </div>
                </article>
                
                <div class="mt-4 text-center">
                    <a href="/" class="btn btn-outline-primary">← 返回首页</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
